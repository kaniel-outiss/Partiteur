<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le partiteur 0.2</title>
<style>
:root{--bg:#14110f;--bg2:#1e1a17;--card:#262019;--or:#E8B04B;--txt:#f3ece2;--dim:#a99c8c;--ink:#1b1712;--paper:#fbf6ec;--line:#3a322a;--rouge:#e06a5a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer}
button.on{background:var(--or);color:var(--ink);border-color:var(--or)}
#home{max-width:720px;margin:0 auto;padding:22px 16px}
#home h1{font:600 30px Georgia,serif;margin:6px 0 2px;color:var(--or)}#home .sub{color:var(--dim);margin-bottom:18px}
#lib{display:grid;gap:10px}
.wk{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:14px;background:var(--card)}
.wk b{font:600 19px Georgia,serif}.wk span{color:var(--dim)}.wk small{color:var(--or);margin-top:4px}.wk.soon{opacity:.55;border-style:dashed}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;background:var(--bg2);border-bottom:1px solid var(--line)}
.grp{display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:10px;background:#00000030}
.grp label{color:var(--dim);font-size:12px;margin-right:2px}.grp output{min-width:42px;text-align:center;font-variant-numeric:tabular-nums}
#bPlay{font-size:20px;min-width:52px;background:var(--or);color:var(--ink);border-color:var(--or)}
#keyname{color:var(--dim);font-size:12px}#mnum{margin-left:auto;color:var(--dim);font-size:12px}
#title{padding:8px 14px 2px}#title b{font:600 20px Georgia,serif;color:var(--or);display:block}#title span{color:var(--dim);font-size:13px}
#mixer{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px}
.mx{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:10px;padding:3px 6px}.mx button{padding:3px 7px;font-size:13px}.mx input{width:70px;accent-color:var(--or)}
.mxn{font-size:13px;margin-right:2px}
#lyr{min-height:34px;padding:4px 14px;font:18px Georgia,serif;color:var(--dim)}#lyr .cur{color:var(--or);font-weight:600}
#scorew{flex:1;overflow:auto;background:var(--paper);border-radius:12px 12px 0 0;margin:0 6px;position:relative}
#score{padding:4px}#score svg{display:block}
svg .sl{stroke:#2b241c;stroke-width:1}svg .bl{stroke:#2b241c;stroke-width:1.2}svg .brace{fill:none;stroke:#2b241c;stroke-width:2.4}
svg .clef{font:38px "Noto Music","Bravura",serif;fill:var(--ink)}svg .clef.f{font-size:30px}
svg .o8{font:italic 10px serif;fill:var(--ink)}svg .acc{font:17px serif;fill:var(--ink)}svg .ts{font:bold 19px Georgia,serif;fill:var(--ink)}
svg .mk{font:italic 12px Georgia,serif;fill:#6b4a1a}svg .dq{font:bold 12px sans-serif;fill:var(--rouge);opacity:.5;cursor:pointer}svg .dq:hover{opacity:1}
svg .pn{font:600 11px sans-serif;fill:#7a6e60}svg .mn{font:10px sans-serif;fill:#9a8d7c}
svg .nh{fill:var(--ink)}svg .nh.hol{fill:none;stroke:var(--ink);stroke-width:1.5}svg .nh.gr{opacity:.85}
svg .dot{fill:var(--ink)}svg .stem{stroke:var(--ink);stroke-width:1.2}svg .stem.gr{stroke-width:.9}
svg .flag{fill:none;stroke:var(--ink);stroke-width:1.6}svg .trem{stroke:var(--ink);stroke-width:2.6}
svg .tri{font:italic bold 10px serif;fill:var(--ink)}svg .arp{fill:none;stroke:var(--ink);stroke-width:1.1}
svg .ferm{font:16px serif;fill:var(--ink)}svg .tie{fill:none;stroke:var(--ink);stroke-width:1.1}
svg .ly{font:13px Georgia,serif;fill:#3a2d1c}svg .rest{font:20px serif;fill:var(--ink)}svg .restg{fill:var(--ink)}
svg .mzone{fill:transparent;cursor:pointer}svg .mzone:hover{fill:#e8b04b18}svg .mzone.inloop{fill:#e8b04b30}
svg #ph{fill:#e8b04b55;pointer-events:none;transition:x .08s linear}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);opacity:0;background:#000d;color:#fff;padding:10px 16px;border-radius:12px;max-width:92vw;transition:.25s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%)}
#wait{position:fixed;inset:auto 0 0 0;margin:auto;bottom:70px;width:max-content;max-width:90vw;display:none;background:var(--or);color:var(--ink);font-weight:600;font-size:17px;padding:14px 22px;border-radius:30px;box-shadow:0 6px 24px #0008;z-index:8;animation:pul 1.4s ease-in-out infinite}
#wait.on{display:block}@keyframes pul{50%{transform:scale(1.05)}}
@media (max-width:640px){.lb{display:none}.bar{gap:4px;padding:6px}.bar button{padding:5px 8px;font-size:14px}#bPlay{min-width:44px;font-size:18px}
.grp label{display:none}.grp output{min-width:30px;font-size:14px}#keyname{font-size:11px;max-width:84px;line-height:1.1}#mnum{width:100%;text-align:right;margin-top:-2px}
#title{padding:6px 10px 0}#title b{font-size:17px}#title span{font-size:12px}#mixer{padding:4px 8px;gap:4px}.mx{padding:2px 4px}.mx input{width:44px}.mxn{font-size:12px}#lyr{font-size:16px;min-height:26px}}
.hbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}h2.sec{font:600 17px Georgia,serif;color:var(--dim);margin:20px 0 8px}
.wk{position:relative}.wk .amb{font-size:12.5px;color:var(--dim);margin-top:6px}.wk .amb i{opacity:.8}.wdel{position:absolute;top:8px;right:8px;padding:3px 7px;background:transparent;border-color:transparent;opacity:.5}
.vb{display:inline-block;font-style:normal;font-size:12px;padding:2px 8px;border-radius:10px;margin-left:4px}.vb.ok{background:#2f6b3a;color:#dff5e3}.vb.tr{background:#6b5a1f;color:#fff2c8}.vb.ko{background:#7a2e26;color:#ffd9d3}
#vbadge{padding:0 14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}#vbadge:empty{display:none}#vbadge .vb{font-size:13px;margin:0}#vbadge button{padding:3px 9px;font-size:13px}
svg .nh.out{fill:#c0392b}svg .nh.hol.out{fill:none;stroke:#c0392b}
#progs{display:grid;gap:8px}.pg{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:10px 12px}.pg>div{flex:1;min-width:0}.pg small{display:block;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.pri{background:var(--or);color:var(--ink);border-color:var(--or)}button:disabled{opacity:.4}
#dlg{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;padding:24px 10px}#dlg.on{display:flex}
.dbox{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:560px;width:100%}.dbox h2{margin:0 0 8px;font:600 20px Georgia,serif;color:var(--or)}.dbox h3{font-size:14px;color:var(--dim);margin:14px 0 6px}
.dbox label{display:block;font-size:12px;color:var(--dim);margin:8px 0}.dbox input,.dbox select{display:block;width:100%;margin-top:3px;font:inherit;padding:8px;border-radius:9px;background:var(--bg);color:var(--txt);border:1px solid var(--line)}
.dbox .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dbox .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.dbox .hint{color:var(--dim);font-size:13px;margin-bottom:8px}
.pr{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin:4px 0}.pr input,.pr select{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.rng{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.rng span{color:var(--dim);font-size:12px}.rng output{min-width:38px;text-align:center;font-weight:600}
.pil{display:grid;gap:5px;margin:8px 0}.pit{display:flex;align-items:center;gap:5px;background:var(--card);border-radius:10px;padding:5px 8px}.pit b{flex:1;font-weight:500}.pno{color:var(--or);font-weight:700;width:18px}.ptr{display:flex;align-items:center;gap:3px;font-size:13px}.pit button{padding:3px 7px}
.pgb{display:block;width:100%;text-align:left;margin:5px 0}
#conc{display:none}body.concert #conc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 12px;background:#3a2a10;border-bottom:1px solid var(--or)}#conc b{color:var(--or)}#conc .nx{color:var(--dim);font-size:13px;flex:1}
body.concert #mixer,body.concert #bProg,body.concert #bMeta,body.concert #bBack{display:none}body.concert #title span{display:none}
</style></head><body>
<div id="home"><h1>🎼 Le partiteur</h1><div class="sub">Airs d’opéra et chœurs : écoute, chante ta voix, transpose.</div>
 <div class="hbar"><button id="vme">🎤 Ma voix</button><button id="bImp">📥 Importer (MusicXML)</button><input type="file" id="fimp" accept=".xml,.musicxml,.mxl,application/vnd.recordare.musicxml+xml,application/vnd.recordare.musicxml" hidden></div>
 <h2 class="sec">📚 Bibliothèque</h2><div id="lib"></div>
 <h2 class="sec">🎭 Programmes</h2><div id="progs"></div></div>
<div id="app" style="display:none">
 <div class="bar">
  <button id="bBack" title="Bibliothèque">←</button>
  <button id="bPlay" title="Lecture (espace)">▶</button><button id="bStop" title="Retour au début">⏮</button>
  <div class="grp"><label>Ton</label><button id="trm">−</button><output id="tr">0</output><button id="trp">+</button><span id="keyname"></span></div>
  <div class="grp"><label>Tempo</label><button id="tm">−</button><output id="tmp">100 %</output><button id="tp">+</button></div>
  <button id="bLoop" title="Boucle">🔁</button><button id="bWait" title="Attendre aux points d’orgue">𝄐<span class="lb"> attendre</span></button>
  <button id="follow" class="on" title="Suivre la lecture">👁<span class="lb"> suivre</span></button><button id="bClef" title="Clé du chant">𝄞/𝄢</button>
  <button id="bProg" title="Ajouter au programme">🎭➕</button><button id="bMeta" title="Fiche de la pièce">✏️</button>
  <span id="mnum"></span>
 </div>
 <div id="conc"></div>
 <div id="title"></div><div id="vbadge"></div><div id="mixer"></div><div id="lyr"></div>
 <div id="scorew"><div id="score"></div></div>
</div>
<button id="wait">𝄐 Point d’orgue — touche pour continuer</button>
<div id="toast"></div>
<div id="dlg"></div>
<script>
const WORKS=[{"id": "tosca-recondita", "title": "Recondita armonia", "composer": "Giacomo Puccini", "work": "Tosca, acte I", "role": "Cavaradossi", "voice": "ténor", "style": "Air d’opéra", "period": "Post-romantique", "ks": -1, "bpm": 48, "parts": [{"id": "v", "name": "Cavaradossi (ténor)", "short": "Canto", "kind": "voice", "clef": "G", "oct": -12, "vt": "T"}, {"id": "rh", "name": "Piano MD", "kind": "piano"}, {"id": "lh", "name": "Piano MG", "kind": "piano"}], "measures": [{"meter": "3/4", "tempo": "Andante lento", "bpm": 48, "marks": ["p"], "v": "rhd", "rh": "r r re C#4e", "lh": "C4 C4 C4", "doubt": "Portée inférieure : clé de FA à l'armure puis clé de SOL immédiatement (LH en clé de sol jusqu'à la m. 9). C#4 : ligne supplémentaire peu visible sur le scan. Liaison C#4 → D4 (m. 2). Tenutos sur les C4 de la MG."}, {"v": "rhd", "rh": "r re D#4s E4s rs F#4s G4s A4s // D4 D4 D4+F4", "lh": "C4 C4 C4", "doubt": "D4 du 3e temps (voix inf.) précédé d'un bécarre (annule le D#4)."}, {"marks": ["p"], "v": "rhd", "rh": "D4+F4+Bb4 r3 G5+D6e3 Bb5+F6e3 G5+D6e3 F5+Bb5e3", "lh": "C4 C4+D4+F4+Bb4 C4+D4+F4+Bb4", "doubt": "1er temps : Bb4 (hampe haut) + D4/F4 (hampe bas) même rythme, fusionnés ; bécarre de précaution sur F4. Triolet : soupir + croche sous crochet 3, puis triolet de croches ; F5+Bb5 final : tête de F5 lue sur la 5e ligne."}, {"v": "rhd", "rh": "D5+G5dd E5+A5s F5+Bb5s G5+C6s F5+Bb5s E5+A5s", "lh": "C4+D4+F4+Bb4 C4+D4+F4+Bb4 re C4+D4+F4+Bb4e", "doubt": "D5+G5 : noire doublement pointée (deux points visibles). MG 3e temps : soupir de croche + accord croche (crochet peu visible)."}, {"marks": ["pp"], "v": "rhd", "rh": "gBb5 E5+A5s D5+G5s gA5 D5+G5s C5+F5s D5+G5 C5+E5+G5+C6!", "lh": "C4+D4+F4+Bb4 C4+D4+F4+Bb4 C4+E4+G4+Bb4!", "doubt": "Petites notes barrées (acciaccatures) Bb5 et A5. Arpèges au 3e temps aux deux mains."}, {"v": "rhd", "rh": "F5+A5+C6e C5+F5+A5e A4+C5+F5 G4+B4+D5ed G5s", "lh": "C4+D4+F4+A4 C4+D4+F4 C4+D4+F4", "doubt": "Staccatos sur les deux croches, tenuto   const W={id:'imp-'+Date.now().toString(36),title:title,composer:composer,work:'',role:'',voice:'',ks:Math.max(-7,Math.min(7,ks0||0)),mode:mode,bpm:MEAS[0].bpm||72,parts:[],measures:[],imported:true,src:fname||''};

  const vtOf=function(n){n=(n||'').toLowerCase();for(let i=0;i<VT.length;i++)if(n.indexOf(VT[i][0])>=0)return VT[i][1];const m=/^\s*([satb])\.?\s*$/i.exec(n);return m?m[1].toUpperCase():'';};
  const VOC=/sopr|alt|ten|bass|bari|mezzo|contr|voice|voix|chant|canto|choir|ch(œ|oe)ur|chorus|^\s*[satb]\.?\s*$/i;
  const SPEC={};/* id → {P,keys:[...]} */
  OUT.forEach(function(P,pi){const keys={};P.meas.forEach(function(m){if(m)Object.keys(m.evs).forEach(function(k){keys[k]=1;});});const K=Object.keys(keys).sort();
    const vocal=P.lyr||VOC.test(P.name);if(!P.name)P.name=vocal?'Voix':'Instrument';
    const pitchMed=function(st){const a=[];P.meas.forEach(function(m){if(m)Object.keys(m.evs).forEach(function(k){if(k.split('|')[0]===st)m.evs[k].forEach(function(e){e.notes.forEach(function(n){const q=/^([A-G])(bb|##|b|#)?(-?\d)$/.exec(n);if(q)a.push(12*(+q[3]+1)+[0,2,4,5,7,9,11]['CDEFGAB'.indexOf(q[1])]);});});});});a.sort(function(x,y){return x-y;});return a.length?a[a.length>>1]:60;};
    const clefOfStaff=function(st){const c=P.clefs[st]||{sign:'G',oct:0};if(c.sign==='F')return {clef:'F',oct:0};if(c.oct===-1)return {clef:'G',oct:-12};return {clef:'G',oct:0};};
    if(vocal){const tot=K.reduce(function(a,k){return a+(P.cnt[k]||0);},0);
      const nmL=P.name.split(/[\s,\/&+]+|-(?=\s)/).map(vtOf).filter(Boolean);
      /* voix secondaires minuscules sur une même portée : on les garde dans la ligne principale (//) */
      const groups=[];K.forEach(function(k){const st=k.split('|')[0];const big=(P.cnt[k]||0)>=tot*.25||nmL.length>1;const g=groups.filter(function(x){return x.st===st;})[0];if(big||!g)groups.push({st:st,keys:[k],main:big});else g.keys.push(k);});
      const G=groups.filter(function(g){return (P.cnt[g.keys[0]]||0)>0;}).length?groups.filter(function(g){return (P.cnt[g.keys[0]]||0)>0;}):groups;
      const nm=P.name.split(/[\s,\/&+]+|-(?=\s)/).map(vtOf).filter(Boolean);const gen=G.length===4?['Soprano','Alto','Ténor','Basse']:null;
      G.forEach(function(g,ki){const k=g.keys[0],st=g.st;const c=clefOfStaff(st);let name=P.name,vt=vtOf(P.name);
        if(G.length>1){if(nm.length===G.length){vt=nm[ki];name=VT.filter(function(x){return x[1]===vt;})[0][2];}else if(gen){name=gen[ki];vt=['S','A','T','B'][ki];}else name=P.name+' '+(ki+1);}
        const id='v'+pi+'_'+ki;W.parts.push({id:id,name:name,kind:'voice',clef:c.clef,oct:c.oct,vt:vt,lyKey:'ly_'+id});SPEC[id]={P:P,keys:g.keys,voice:true};});}
    else{const st=[];K.forEach(function(k){const s=k.split('|')[0];if(st.indexOf(s)<0)st.push(s);});st.sort();
      st.forEach(function(s,si){const c={clef:pitchMed(s)>=57?'G':'F'};const id='i'+pi+'_'+si;const base=P.name;
        W.parts.push({id:id,name:st.length>1?base+(si===0?' MD':' MG'):base,kind:'piano',clef:c.clef});SPEC[id]={P:P,keys:K.filter(function(k){return k.split('|')[0]===s;}),voice:false};});}});
  if(!W.parts.length)throw new Error('aucune note trouvée');
  /* division propre à chaque partie */
  const DIVS={};parts.forEach(function(part){let d=1;const pid=part.getAttribute('id');DIVS[pid]=[];[].slice.call(part.querySelectorAll(':scope > measure')).forEach(function(me,mi){const x=me.querySelector('attributes divisions');if(x)d=+x.textContent;DIVS[pid][mi]=d;});});
  const tieState={};
  MEAS.forEach(function(MM,i){const L=mlen[i].real>0?mlen[i].real:mlen[i].L;const m={};if(MM.meter)m.meter=MM.meter;if(MM.bpm)m.bpm=MM.bpm;if(MM.marks.length)m.marks=MM.marks;
    if(Math.abs(L-mlen[i].L)>1e-4)m.len=L;
    W.parts.forEach(function(Q){const S=SPEC[Q.id],PM=S.P.meas[i];const div=DIVS[S.P.pid][i]||1;
      if(!PM){m[Q.id]=mxSplit(L).map(function(s){return 'r'+s;}).join(' ');return;}
      const strs=S.keys.map(function(k){const r=voiceStr(PM.evs[k],div,L,S.voice,tieState[Q.id+k]);tieState[Q.id+k]=r.tied;return r;}).filter(function(r,j){return r.s||j===0;});
      m[Q.id]=strs.map(function(r){return r.s||mxSplit(L).map(function(s){return 'r'+s;}).join(' ');}).join(' // ');
      if(S.voice){const sy=strs[0]?strs[0].sy:[];m[Q.lyKey]=sy.join(' ');}});
    W.measures.push(m);});
  /* pupitre sans paroles : emprunter celles de sa voisine de portée quand le rythme est le même */
  W.parts.filter(function(Q){return Q.kind==='voice';}).forEach(function(Q){if(W.measures.some(function(m){return /[^_\s]/.test(m[Q.lyKey]||'');}))return;
    const sib=W.parts.filter(function(R){return R.kind==='voice'&&R!==Q&&SPEC[R.id].P===SPEC[Q.id].P&&SPEC[R.id].keys[0].split('|')[0]===SPEC[Q.id].keys[0].split('|')[0];})[0]||W.parts.filter(function(R){return R.kind==='voice'&&R!==Q&&W.measures.some(function(m){return /[^_\s]/.test(m[R.lyKey]||'');});})[0];
    if(!sib)return;W.measures.forEach(function(m){const a=(m[Q.lyKey]||'').split(/\s+/).filter(Boolean),b=(m[sib.lyKey]||'').split(/\s+/).filter(Boolean);if(a.length===b.length)m[Q.lyKey]=b.join(' ');});});
  W.voice=W.parts.filter(function(Q){return Q.kind==='voice';}).map(function(Q){return Q.name;}).join(', ')||'instrumental';
  return W;}

<script>
/* ═══════════ 📚 BIBLIOTHÈQUE · 🎤 MA VOIX · 🎭 PROGRAMMES & CONCERT ═══════════ */
'use strict';
/* — stockage des partitions importées (IndexedDB, secours localStorage) — */
const IDB={db:null,open:function(){return new Promise(function(ok,ko){try{const r=indexedDB.open('partiteur',1);r.onupgradeneeded=function(){r.result.createObjectStore('works',{keyPath:'id'});};r.onsuccess=function(){IDB.db=r.result;ok();};r.onerror=function(){ko(r.error);};}catch(e){ko(e);}});},
  all:function(){return new Promise(function(ok){if(!IDB.db)return ok(LS.get('works',[]));const q=IDB.db.transaction('works').objectStore('works').getAll();q.onsuccess=function(){ok(q.result||[]);};q.onerror=function(){ok([]);};});},
  put:function(W){return new Promise(function(ok){const c=JSON.parse(JSON.stringify(W,function(k,v){return k.charAt(0)==='_'?undefined:v;}));if(!IDB.db){const a=LS.get('works',[]).filter(function(x){return x.id!==W.id;});a.push(c);LS.set('works',a);return ok();}
    const t=IDB.db.transaction('works','readwrite');t.objectStore('works').put(c);t.oncomplete=ok;t.onerror=ok;});},
  del:function(id){return new Promise(function(ok){if(!IDB.db){LS.set('works',LS.get('works',[]).filter(function(x){return x.id!==id;}));return ok();}const t=IDB.db.transaction('works','readwrite');t.objectStore('works').delete(id);t.oncomplete=ok;t.onerror=ok;});}};
function libLoad(){return IDB.open().catch(function(){}).then(IDB.all).then(function(a){a.forEach(function(W){if(!WORKS.some(function(x){return x.id===W.id;}))WORKS.push(W);});});}

/* — ma voix — zones confortables (hauteur réelle) — */
const VPRE=[['S','Soprano',60,81],['Mz','Mezzo',57,77],['A','Alto',53,74],['T','Ténor',48,69],['Bar','Baryton',45,65],['B','Basse',41,62]];
function myVoice(){return LS.get('voice',null);}
function pName(m){return SH[(m%12+12)%12].replace('#','♯')+(Math.floor(m/12)-1);}
function vName(v){const p=VPRE.filter(function(x){return x[0]===v.vt;})[0];return p?p[1]:'Ma voix';}
/* — analyse d'une partie : ambitus, tessiture, meilleure transposition — */
function partNotes(W,P){const M=W._M||(W._M=build(W));const out=[];M.forEach(function(m,i){(m.parts[P.id]||[]).forEach(function(V){V.forEach(function(e,j){if(e.rest||e.grace||!e.notes.length)return;
  const prev=j>0?V[j-1]:null;if(prev&&prev.tie&&!prev.rest)return;out.push({m:e.notes[e.notes.length-1].midi+(P.oct||0),d:Math.max(.25,e.d),i:i});});});});return out;}
function costAt(N,t,lo,hi){let c=0,tot=0,mean=0;N.forEach(function(n){const s=n.m+t;c+=n.d*Math.max(0,lo-s,s-hi)*4;tot+=n.d;mean+=n.d*s;});return c+(tot?Math.abs(mean/tot-(lo+hi)/2)*.15*tot:0)+Math.abs(t)*.01;}
function outAt(N,t,lo,hi){const o=N.filter(function(n){return n.m+t<lo||n.m+t>hi;});const ms=[];o.forEach(function(n){if(ms.indexOf(n.i+1)<0)ms.push(n.i+1);});return {n:o.length,ms:ms,hi:o.filter(function(n){return n.m+t>hi;}).length};}
function anOf(W){const v=myVoice();const VP=W.parts.filter(function(P){return P.kind==='voice';});if(!v||!VP.length)return null;
  const key=v.vt+v.lo+v.hi+'|'+(LS.get('sing:'+W.id,null)||'');if(W._an&&W._ank===key)return W._an;
  const sing=LS.get('sing:'+W.id,null);let cand=VP.filter(function(P){return P.id===sing;});if(!cand.length)cand=VP.filter(function(P){return P.vt&&P.vt===v.vt;});if(!cand.length)cand=VP;
  let best=null;cand.forEach(function(P){const N=partNotes(W,P);if(!N.length)return;let bt=0,bo=0,bc=1e18;[0,-12,12].forEach(function(o){for(let t=-7;t<=7;t++){const c=costAt(N,t+o,v.lo,v.hi)+(o?.5:0);if(c<bc-1e-9){bc=c;bt=t;bo=o;}}});if(!best||bc<best.c)best={P:P,N:N,c:bc,t:bt,o:bo};});
  if(!best)return null;const N=best.N;let lo=999,hi=-999;N.forEach(function(n){lo=Math.min(lo,n.m);hi=Math.max(hi,n.m);});
  const srt=N.slice().sort(function(a,b){return a.m-b.m;}),tot=N.reduce(function(a,n){return a+n.d;},0);let acc=0,tlo=null,thi=null;srt.forEach(function(n){acc+=n.d;if(tlo==null&&acc>=tot*.1)tlo=n.m;if(thi==null&&acc>=tot*.9)thi=n.m;});
  const r={pid:best.P.id,pname:best.P.name,lo:lo,hi:hi,tlo:tlo,thi:thi,best:best.t,oct:best.o,N:N,v:v};W._an=r;W._ank=key;return r;}
function anBadge(an,t){if(!an)return null;const O=an.oct||0,o=outAt(an.N,t+O,an.v.lo,an.v.hi),ob=outAt(an.N,an.best+O,an.v.lo,an.v.hi);const oc=O<0?' · une octave plus bas':(O>0?' · une octave plus haut':'');
  if(!o.n)return {cls:'ok',txt:'✅ confortable'+(t?' (en '+(t>0?'+':'')+t+')':'')+oc};
  if(!ob.n)return {cls:'tr',txt:'↕ confortable en '+(an.best>0?'+':'')+an.best+oc,best:an.best};
  return {cls:'ko',txt:'⚠ '+o.n+' note'+(o.n>1?'s':'')+' hors zone'+oc+(an.best!==t?' · mieux en '+(an.best>0?'+':'')+an.best:''),best:an.best!==t?an.best:null,ms:o.ms};}
function isOut(P,midi){const an=ST.an;if(!an||P.id!==an.pid)return false;const s=midi+(P.oct||0)+ST.tr+(an.oct||0);return s<an.v.lo||s>an.v.hi;}
function lyPart(){const W=ST.W;if(!W)return null;const VP=W.parts.filter(function(P){return P.kind==='voice';});
  return VP.filter(function(P){return P.id===ST.sing;})[0]||(ST.an&&VP.filter(function(P){return P.id===ST.an.pid;})[0])||VP[0]||null;}

/* — écran d'accueil — */
const STYLES=['Air d’opéra','Oratorio','Messe','Motet','Cantique','Negro spiritual','Lied','Mélodie','Chœur','Autre'];
const PERIODS=['Renaissance','Baroque','Classique','Romantique','Post-romantique','XXᵉ siècle','Traditionnel'];
function wkCard(W){const an=anOf(W),b=anBadge(an,LS.get('tr:'+W.id,0));

    +'<small>'+[W.style,W.period,W.voice].filter(Boolean).map(esc).join(' · ')+' · '+W.measures.length+' mes.</small>'
    +(an?'<div class="amb">'+esc(an.pname)+' : '+pName(an.lo)+'–'+pName(an.hi)+' <i>(tessiture '+pName(an.tlo)+'–'+pName(an.thi)+')</i> <em class="vb '+b.cls+'">'+b.txt+'</em></div>':'')
    +(W.imported?'<button class="wdel" data-del="'+W.id+'" title="Supprimer">🗑</button>':'')+'</div>';}
library=function(){const v=myVoice();
  $('#vme').innerHTML=v?'🎤 '+vName(v)+' · '+pName(v.lo)+'–'+pName(v.hi):'🎤 Ma voix';
  $('#lib').innerHTML=WORKS.map(wkCard).join('')+'<div class="wk soon"><b>📥 Ajouter une partition</b><span>Fichier MusicXML (.musicxml, .mxl) — exporté de MuseScore, ou téléchargé sur CPDL / IMSLP.</span></div>';
  progList();};
document.addEventListener('click',function(e){const d=e.target.closest('[data-del]');if(d){e.stopPropagation();const W=WORKS.filter(function(x){return x.id===d.dataset.del;})[0];
    if(W&&confirm('Supprimer « '+W.title+' » ?')){IDB.del(W.id).then(function(){WORKS.splice(WORKS.indexOf(W),1);library();});}return;}
  const w=e.target.closest('#lib [data-w]');if(w){open(w.dataset.w);return;}

/* — ma voix (fenêtre) — */
function voiceDlg(){const v=myVoice()||{vt:'B',lo:41,hi:62};let cur=JSON.parse(JSON.stringify(v));
  const draw=function(){dlg('<h2>🎤 Ma voix</h2><div class="hint">La zone où tu chantes à l’aise (hauteur réelle). Le partiteur s’en sert pour te dire si un air te va, et dans quelle tonalité.</div>'
    +'<div class="chips">'+VPRE.map(function(p){return '<button data-vp="'+p[0]+'" class="'+(cur.vt===p[0]?'on':'')+'">'+p[1]+'</button>';}).join('')+'</div>'
    +'<div class="rng"><span>grave</span><button data-vr="lo-">−</button><output>'+pName(cur.lo)+'</output><button data-vr="lo+">+</button><span>aigu</span><button data-vr="hi-">−</button><output>'+pName(cur.hi)+'</output><button data-vr="hi+">+</button></div>'

    IDB.put(W).then(function(){if(WORKS.indexOf(W)<0)WORKS.push(W);dlgClose();library();toast('✅ « '+W.title+' » ajouté');});};}

/* — badge de voix dans la partition — */

document.addEventListener('click',function(e){const a=e.target.closest('[data-adapt]');if(a){ST.tr=+a.dataset.adapt;LS.set('tr:'+ST.W.id,ST.tr);render();toast('↕ Transposé en '+(ST.tr>0?'+':'')+ST.tr+' pour ta voix');}

/* — 🎭 programmes — */
function progs(){return LS.get('progs',[]);}

function progList(){const el=$('#progs');if(!el)return;const P=progs();
  el.innerHTML=P.map(function(p,pi){return '<div class="pg"><div><b>'+esc(p.name)+'</b><small>'+p.items.length+' pièce'+(p.items.length>1?'s':'')+' · '+p.items.map(function(it){const W=wById(it.w);return W?esc(W.title):'?';}).join(' · ')+'</small></div>'
    +'<button data-pc="'+pi+'" class="pri"'+(p.items.length?'':' disabled')+'>▶ Concert</button><button data-pe="'+pi+'">✏️</button></div>';}).join('')
    +'<button id="pnew">➕ Nouveau programme</button>';}
function progEdit(pi){const A=progs();const p=A[pi];
  const draw=function(){dlg('<h2>🎭 Programme</h2><label>Nom<input id="pName" value="'+esc(p.name)+'"></label>'
    +'<div class="pil">'+p.items.map(function(it,i){const W=wById(it.w);return '<div class="pit"><span class="pno">'+(i+1)+'</span><b>'+(W?esc(W.title):'?')+'</b>'
      +'<span class="ptr"><button data-it="tr-" data-i="'+i+'">−</button>'+(it.tr>0?'+':'')+it.tr+'<button data-it="tr+" data-i="'+i+'">+</button></span>'
      +'<button data-it="up" data-i="'+i+'">↑</button><button data-it="dn" data-i="'+i+'">↓</button><button data-it="x" data-i="'+i+'">✕</button></div>';}).join('')+'</div>'
    +'<label>Ajouter<select id="pAdd"><option value="">— choisir une pièce —</option>'+WORKS.map(function(W){return '<option value="'+W.id+'">'+esc(W.title)+' — '+esc(W.composer||'')+'</option>';}).join('')+'</select></label>'
    +'<div class="row"><button id="pok" class="pri">Enregistrer</button><button id="pdel">Supprimer le programme</button><button data-close="1">Fermer</button></div>');
    $('#pName').oninput=function(){p.name=this.value;};
    $('#pAdd').onchange=function(){if(this.value){p.items.push({w:this.value,tr:LS.get('tr:'+this.value,0)});draw();}};
    $('#dlg').querySelectorAll('[data-it]').forEach(function(b){b.onclick=function(){const i=+b.dataset.i,k=b.dataset.it,a=p.items;
      if(k==='tr-')a[i].tr--;if(k==='tr+')a[i].tr++;if(k==='up'&&i>0){const t=a[i];a[i]=a[i-1];a[i-1]=t;}if(k==='dn'&&i<a.length-1){const t=a[i];a[i]=a[i+1];a[i+1]=t;}if(k==='x')a.splice(i,1);draw();};});
    $('#pok').onclick=function(){A[pi]=p;progSave(A);dlgClose();progList();};
    $('#pdel').onclick=function(){if(confirm('Supprimer « '+p.name+' » ?')){A.splice(pi,1);progSave(A);dlgClose();progList();}};};
  draw();}
document.addEventListener('click',function(e){
  if(e.target.closest('#pnew')){const A=progs();A.push({name:'Programme '+(A.length+1),items:[]});progSave(A);progEdit(A.length-1);return;}
  const pe=e.target.closest('[data-pe]');if(pe){progEdit(+pe.dataset.pe);return;}
  const pc=e.target.closest('[data-pc]');if(pc){concertStart(+pc.dataset.pc,0);return;}
  if(e.target.closest('#bProg')){const A=progs();if(!ST.W)return;
    dlg('<h2>➕ Ajouter « '+esc(ST.W.title)+' »</h2><div class="hint">Avec la transposition actuelle ('+(ST.tr>0?'+':'')+ST.tr+').</div>'
      +A.map(function(p,i){return '<button class="pgb" data-pa="'+i+'">🎭 '+esc(p.name)+' <small>('+p.items.length+')</small></button>';}).join('')
      +'<button class="pgb" data-pa="new">➕ Nouveau programme</button><div class="row"><button data-close="1">Annuler</button></div>');
    $('#dlg').querySelectorAll('[data-pa]').forEach(function(b){b.onclick=function(){const A2=progs();let i=b.dataset.pa;if(i==='new'){A2.push({name:'Programme '+(A2.length+1),items:[]});i=A2.length-1;}else i=+i;
      A2[i].items.push({w:ST.W.id,tr:ST.tr});progSave(A2);dlgClose();toast('🎭 Ajouté à « '+A2[i].name+' » ('+A2[i].items.length+'ᵉ pièce)');};});}
  if(e.target.closest('#vme'))voiceDlg();
  if(e.target.closest('#bMeta')&&ST.W){metaDlg(ST.W,false);}
});

/* — mode concert — */
let CONC=null;
function concertStart(pi,i){const p=progs()[pi];if(!p||!p.items[i])return;const it=p.items[i];if(!wById(it.w)){toast('Pièce introuvable');return;}
  CONC={pi:pi,i:i,p:p,pending:false};document.body.classList.add('concert');stop();open(it.w);ST.tr=it.tr;render();seek(0);concBar();
  const ph=$('#scorew');if(ph)ph.scrollTop=0;}
function concBar(){const c=$('#conc');if(!CONC){c.innerHTML='';return;}const p=CONC.p,n=p.items[CONC.i+1],W=n&&wById(n.w);
  c.innerHTML='<b>🎭 '+esc(p.name)+'</b><span>'+(CONC.i+1)+' / '+p.items.length+'</span><button data-cg="-1"'+(CONC.i?'':' disabled')+'>⏮</button><button data-cg="1"'+(n?'':' disabled')+'>⏭</button>'
    +'<span class="nx">'+(W?'ensuite : '+esc(W.title):'dernière pièce')+'</span><button data-cg="x">✕ Quitter</button>';}
function concertEnd(){CONC=null;document.body.classList.remove('concert');$('#wait').classList.remove('on');concBar();}
function onPieceEnd(){if(!CONC)return;const n=CONC.p.items[CONC.i+1];const w=$('#wait');
  if(!n){w.textContent='👏 Fin du programme';w.classList.add('on');CONC.pending='end';return;}
  CONC.pending=true;w.textContent='▶ Suivant : '+(wById(n.w)||{}).title+' — touche quand tu es prêt';w.classList.add('on');}
document.addEventListener('click',function(e){
  const g=e.target.closest('[data-cg]');if(g){const k=g.dataset.cg;if(k==='x'){stop();concertEnd();return;}const j=CONC.i+ +k;$('#wait').classList.remove('on');concertStart(CONC.pi,j);return;}
  if(e.target.closest('#wait')&&CONC&&CONC.pending){e.stopPropagation();const w=$('#wait');w.classList.remove('on');w.textContent='𝄐 Point d’orgue — touche pour continuer';
    if(CONC.pending==='end'){concertEnd();return;}concertStart(CONC.pi,CONC.i+1);setTimeout(play,400);}},true);
const _back=function(){if(CONC)concertEnd();};
document.addEventListener('click',function(e){if(e.target.closest('#bBack'))_back();},true);
window.addEventListener('DOMContentLoaded',function(){const f=$('#fimp');f.onchange=function(){if(f.files[0])importFile(f.files[0]);f.value='';};
  $('#bImp').onclick=function(){f.click();};});

</script>
</body></html>
