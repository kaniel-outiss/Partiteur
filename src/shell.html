<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14110f">
<title>Le partiteur __VER__</title>
<style>
:root{--bg:#14110f;--bg2:#1c1815;--card:#26201a;--card2:#2f2820;--or:#E8B04B;--or2:#f3c873;--txt:#f3ece2;--dim:#a99c8c;--ink:#1b1712;--paper:#fbf7ef;--line:#3a322a;--rouge:#e06a5a;--vert:#4fb873;--bleu:#5b8def;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.42 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:7px 11px;cursor:pointer;line-height:1.15;touch-action:manipulation}
button:active{transform:scale(.97)}button.on{background:var(--or);color:var(--ink);border-color:var(--or)}button:disabled{opacity:.4}
button.pri{background:var(--or);color:var(--ink);border-color:var(--or);font-weight:600}button.ghost{background:transparent;border-color:transparent}
input,select,textarea{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px}
.hint{color:var(--dim);font-size:13px}.pad{padding:14px}
[hidden]{display:none!important}
/* ── accueil ── */
#home{max-width:780px;margin:0 auto;padding:calc(18px + var(--safe-t)) 14px 40px}
#home h1{font:600 30px Georgia,serif;margin:4px 0 0;color:var(--or)}#home .sub{color:var(--dim);margin:2px 0 14px}
.hbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
h2.sec{font:600 17px Georgia,serif;color:var(--dim);margin:22px 0 8px;display:flex;align-items:center;gap:8px}
#lib{display:grid;gap:10px}@media(min-width:700px){#lib{grid-template-columns:1fr 1fr}}
.wk{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:15px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.wk:hover{border-color:#5a4a33}.wk b{font:600 19px Georgia,serif}.wk span{color:var(--dim)}.wk small{color:var(--or);margin-top:4px}
.wk .amb{font-size:12.5px;color:var(--dim);margin-top:6px}.wk.soon{opacity:.6;border-style:dashed}.wk small b.pref{color:var(--txt)}
.wdel{position:absolute;top:8px;right:8px;padding:3px 7px;background:transparent;border-color:transparent;opacity:.5}
.vb{display:inline-block;font-style:normal;font-size:12px;padding:2px 8px;border-radius:10px;margin-left:4px}.vb.ok{background:#2f6b3a;color:#dff5e3}.vb.tr{background:#6b5a1f;color:#fff2c8}.vb.ko{background:#7a2e26;color:#ffd9d3}
#nav{margin-bottom:10px}#fq{width:100%;padding:11px 13px;border-radius:13px;background:var(--card)}
.fl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.fl select{font-size:13px;padding:6px 8px;background:var(--card);max-width:46vw}.fl select.on{border-color:var(--or);color:var(--or)}.fl button{font-size:13px;padding:6px 10px}
h3.gh{font:600 16px Georgia,serif;color:var(--or);margin:14px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px;grid-column:1/-1}h3.gh small{color:var(--dim);font:12px sans-serif}
#progs{display:grid;gap:8px}.pg{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:13px;padding:10px 12px}.pg>div{flex:1;min-width:0}.pg small{display:block;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ── poste de travail ── */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}#scorew{flex:1;min-height:0}
@media(min-width:1000px){body.sheeton #app{padding-right:370px}#sheet{position:fixed;right:0;top:0;bottom:0;width:370px;max-height:none!important;border-left:1px solid var(--line);border-top:0!important;z-index:6}}
.top{display:flex;align-items:center;gap:8px;padding:calc(6px + var(--safe-t)) 8px 6px;background:var(--bg2);border-bottom:1px solid var(--line);min-height:50px}
#title{flex:1;min-width:0;line-height:1.15}#title b{font:600 17px Georgia,serif;color:var(--or);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#title span{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#mnum{color:var(--dim);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.top button{padding:7px 10px}
#info{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 10px;background:var(--bg2)}#info:empty{display:none}#info .vb{font-size:12.5px;margin:0}#info button{padding:3px 9px;font-size:13px}
#scorew{overflow:auto;background:var(--paper);position:relative;-webkit-overflow-scrolling:touch}
#score{position:relative;margin:0 auto;min-height:100%;color:#14100b}#score>svg#sv{display:block}
#ovl{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#cursor{position:absolute;left:0;top:0;width:3px;border-radius:2px;background:#e8a42fcc;box-shadow:0 0 10px #e8a42f88;pointer-events:none;opacity:0;transition:opacity .2s;will-change:transform}#cursor.on{opacity:1}
#sv g.note.play,#sv g.chord.play{fill:#d4790c;color:#d4790c}#sv g.note.play .notehead{filter:drop-shadow(0 0 2px #f5a62a)}
#sv g.measure{cursor:pointer}
#sv g.note.hrh{fill:#2457b8;color:#2457b8}#sv g.note.hlh{fill:#b8561c;color:#b8561c}#sv g.note.out{fill:#c0392b;color:#c0392b}
#sv g.note.pj-ok{fill:#2f8f4e;color:#2f8f4e}#sv g.note.pj-mid{fill:#c98a12;color:#c98a12}#sv g.note.pj-bad{fill:#c0392b;color:#c0392b}
#sv g.note.mine{fill:#0d0a06}#sv.dimothers g.staff:not(.mystaff){opacity:.42}
#ovl .lp{fill:#e8b04b2a;stroke:#e8b04b;stroke-width:1}#ovl .lp.sel{fill:#e8b04b44}
#ovl .chs{font:600 13px Georgia,serif;fill:#8a3b12}#ovl .nhn{font:700 7.5px sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}#ovl .brm{font:bold 24px Georgia,serif;fill:#1d6fb8}
#ovl .pjl{stroke-width:3.2;stroke-linecap:round;opacity:.9;fill:none}#ovl .ann{font:italic 600 13px Georgia,serif;fill:#7a1fa2}
.pjg{color:#3fbf6b;stroke:#2f8f4e}.pjo{color:#e0a020;stroke:#c98a12}.pjr{color:#e05a4a;stroke:#c0392b}.pjn{color:var(--dim);stroke:#9a8d7c}
#annbar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:6px 8px;background:#2a1f30;border-bottom:1px solid #7a1fa2}#annbar button{min-width:38px;padding:6px 8px;font-size:15px}#annbar button.on{outline:2px solid #fff;background:var(--card2)}#annbar .pri{margin-left:auto}
body.annmode #score{cursor:crosshair;touch-action:none}body.annmode #ovl{pointer-events:none}
#ovl .mk rect{fill:#1d6fb8;opacity:.9}#ovl .mk text{font:600 12px sans-serif;fill:#fff}
body.bredit #score{cursor:crosshair;outline:2px dashed #1d6fb8;outline-offset:-4px}
/* justesse : bandeau fin entre l'en-tête et la partition — ne recouvre jamais les notes */
#pjHud{display:none;align-items:center;gap:12px;padding:3px 12px;background:#1e1a17;color:var(--txt);border-bottom:1px solid var(--line);min-height:32px}#pjHud.on{display:flex}
#pjHud .n{font:700 19px Georgia,serif;color:var(--or);min-width:46px}#pjHud .t{font-size:12px;color:var(--dim);min-width:86px}#pjHud .c{font:600 13px sans-serif;min-width:54px;text-align:right}
#pjHud .k{flex:1;max-width:320px;position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,#c0392b 0,#c98a12 20%,#2f8f4e 35%,#2f8f4e 65%,#c98a12 80%,#c0392b 100%);margin-top:4px}#pjHud .k i{position:absolute;top:-3px;width:4px;height:14px;margin-left:-2px;background:#fff;border-radius:2px;transition:left .06s}
#lyrbox{background:var(--bg2);border-top:1px solid var(--line);padding:4px 12px}#lyrbox:not(.on){display:none}
#lyr{font:18px Georgia,serif;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#lyr b{color:var(--or)}
#lyr2{font-size:13px;color:var(--dim)}#lyr2 .ipa{font-family:"Charis SIL","Doulos SIL","Gentium Plus",serif;color:#cdb98a}#lyr2 .fr{font-style:italic}
#conc{display:none}body.concert #conc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 12px;background:#3a2a10;border-bottom:1px solid var(--or)}#conc b{color:var(--or)}#conc .nx{color:var(--dim);font-size:13px;flex:1}
/* transport */
.tp{display:flex;align-items:center;gap:6px;padding:8px 8px calc(8px + var(--safe-b));background:var(--bg2);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}.tp::-webkit-scrollbar{display:none}
.tp button{min-width:42px;height:42px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:4px;flex-shrink:0}
#bPlay{min-width:58px;height:50px;border-radius:25px;background:var(--or);color:var(--ink);border-color:var(--or)}#bPlay.on{background:#f3c873}
.tp svg{width:22px;height:22px;fill:currentColor}
.stp{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;flex-shrink:0;height:42px}.stp button{border:0;background:transparent;min-width:34px;height:40px;padding:0 6px}
.stp output{min-width:46px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px;line-height:1.05}.stp output small{display:block;font-size:10px;color:var(--dim)}
.tp .tabs{display:flex;gap:6px;margin-left:auto}.tp .tab{font-size:19px}.tp .tab span{display:none}.tp .tab.cur{background:var(--card2);border-color:var(--or)}
@media(max-width:760px){.tp{flex-wrap:wrap;justify-content:center;gap:5px;padding-top:4px}.tp .tabs{order:-1;width:100%;margin:0 0 2px;justify-content:space-between;gap:2px}
 .tp .tab{flex:1;height:auto;min-width:0;flex-direction:column;gap:0;padding:3px 0;font-size:17px;background:transparent;border-color:transparent}.tp .tab span{display:block;font-size:10px;color:var(--dim)}.tp .tab.cur{background:var(--card2)}
 .tp{gap:4px;padding-left:4px;padding-right:4px}.tp>button{min-width:36px;height:44px;padding:0 4px}#bPlay{min-width:54px;height:48px}.stp{height:44px}.stp button{min-width:26px;padding:0 2px}.stp output{min-width:38px;font-size:12.5px}}
@media(max-width:360px){.tp>button{min-width:32px}.stp button{min-width:22px}.stp output{min-width:34px}}
/* panneau d'outils */
#sheet{background:var(--bg2);border-top:1px solid var(--line);max-height:42vh;overflow:auto;display:flex;flex-direction:column}
#sheet[hidden]{display:none}
.shh{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg2);z-index:2}.shh b{flex:1;color:var(--or);font:600 16px Georgia,serif}
.shtabs{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);overflow-x:auto}.shtabs button{font-size:13px;padding:6px 10px;flex-shrink:0}
.shb{padding:10px 12px 18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.row>label{color:var(--dim);font-size:13px;min-width:92px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chips button{font-size:13.5px;padding:6px 10px}
.mx{display:grid;grid-template-columns:1fr auto auto auto auto;gap:6px;align-items:center;background:var(--card);border-radius:12px;padding:7px 9px;margin:6px 0}
.mx .nm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mx .nm small{display:block;color:var(--dim);font-size:11px}
.mx button{padding:5px 8px;font-size:13px}.mx input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--or)}
.mx.me{outline:1px solid var(--or)}
h4{margin:14px 0 6px;color:var(--dim);font:600 12px sans-serif;text-transform:uppercase;letter-spacing:.06em}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #2a241e}.sw:last-child{border:0}.sw span small{display:block;color:var(--dim);font-size:12px}
.tg{width:46px;height:26px;border-radius:13px;background:#3a322a;border:0;position:relative;flex-shrink:0;padding:0;min-width:0}.tg::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#cbbfae;transition:.15s}.tg.on{background:var(--or)}.tg.on::after{left:23px;background:#fff}
input[type=range]{accent-color:var(--or)}
/* clavier */
#pno{background:var(--bg2);border-top:1px solid var(--line)}#pkb{overflow-x:auto;padding:4px 6px 6px;touch-action:none}#pksv{display:block;margin:0 auto}
#pksv .kw{fill:#f7f1e6;stroke:#6b5f50;stroke-width:1}#pksv .kb{fill:#1b1712;stroke:#000}#pksv .kc{font:9px sans-serif;fill:#8a7c6a;pointer-events:none}
#pksv .prh{fill:#5b8def}#pksv .plh{fill:#ef8f4b}#pksv .trh{fill:#2f6fe0}#pksv .tlh{fill:#e0702a}#pksv .nx{fill:#c9b37a}#pksv .kb.nx{fill:#7a6a3a}#pksv .pv{fill:#d4790c}
#pksv .dn{fill:#3fb36b!important}#pksv .bad{fill:#d9473a!important}
/* livret */
.txl{padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}.txl:hover{background:#ffffff08}.txl.cur{background:#e8b04b1c;outline:1px solid #e8b04b55}
.txl .it{font:600 17px Georgia,serif}.txl .it small{float:right;font:11px sans-serif;color:var(--dim)}.txl .ipa{font-family:"Charis SIL","Doulos SIL","Gentium Plus",serif;color:#cdb98a;font-size:15px;margin:2px 0}
.wb{display:flex;flex-wrap:wrap;gap:4px 12px;margin:4px 0}.wb span{display:flex;flex-direction:column;line-height:1.15}.wb b{font-weight:500;font-size:13.5px}.wb i{font-size:11.5px;color:var(--dim)}.txl .fr{font-style:italic;color:#e9dcc6;font-size:14px}
.ctx{background:var(--card);border-radius:10px;padding:6px 10px;margin:6px 0;font-size:13.5px}.ctx summary{cursor:pointer;color:var(--or);font-weight:600}.ctx ul{padding-left:18px;margin:6px 0}
.tk{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:10px;padding:6px 8px;margin:5px 0}.tk>div{flex:1}.tk small{display:block;color:var(--dim);font-size:11.5px}.tk button{padding:4px 8px}
body.recording #bRec{background:#c0392b;border-color:#c0392b;color:#fff;animation:pul 1.2s infinite}
/* dialogues, toasts */
#toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(30px);opacity:0;background:#000d;color:#fff;padding:10px 16px;border-radius:12px;max-width:92vw;transition:.25s;pointer-events:none;z-index:30;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#wait{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + var(--safe-b));max-width:90vw;display:none;background:var(--or);color:var(--ink);font-weight:600;font-size:17px;padding:14px 22px;border-radius:30px;box-shadow:0 6px 24px #0008;z-index:25;animation:pul 1.4s ease-in-out infinite;border:0}
#wait.on{display:block}@keyframes pul{50%{transform:translateX(-50%) scale(1.05)}}
#count{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:24}#count.on{display:flex}#count b{font:700 120px Georgia,serif;color:#e8b04bcc;text-shadow:0 4px 30px #000a}
#dlg{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;z-index:40;overflow:auto;padding:24px 10px}#dlg.on{display:flex}
.dbox{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:560px;width:100%}.dbox h2{margin:0 0 8px;font:600 20px Georgia,serif;color:var(--or)}.dbox h3{font-size:14px;color:var(--dim);margin:14px 0 6px}
.dbox label{display:block;font-size:12px;color:var(--dim);margin:8px 0}.dbox input,.dbox select{display:block;width:100%;margin-top:3px}
.dbox .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dbox .row{margin-top:14px}.dbox .big{font:700 44px Georgia,serif;color:var(--or);text-align:center}
.pr{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin:4px 0}.pr input,.pr select{margin:0}
.rng{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.rng span{color:var(--dim);font-size:12px}.rng output{min-width:38px;text-align:center;font-weight:600}
.pil{display:grid;gap:5px;margin:8px 0}.pit{display:flex;align-items:center;gap:5px;background:var(--card);border-radius:10px;padding:5px 8px}.pit b{flex:1;font-weight:500}.pno{color:var(--or);font-weight:700;width:18px}.ptr{display:flex;align-items:center;gap:3px;font-size:13px}.pit button{padding:3px 7px}
.pgb{display:block;width:100%;text-align:left;margin:5px 0}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:var(--bg);z-index:50;color:var(--or);font:600 22px Georgia,serif}#boot small{color:var(--dim);font:13px sans-serif}
</style></head><body>
