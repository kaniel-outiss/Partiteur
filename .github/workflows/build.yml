name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Préparer www
        run: mkdir -p www && cp partiteur.html www/index.html
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Micro (justesse de la voix)
        run: sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Sauvegarde automatique (Documents/PianoTools)
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <application android:requestLegacyExternalStorage="true"#' android/app/src/main/AndroidManifest.xml
          grep -n "EXTERNAL_STORAGE\|requestLegacy" android/app/src/main/AndroidManifest.xml
      - name: Bibliothèque .fab (lire Documents/Partiteur, Android 11+)
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "MANAGE_EXTERNAL" android/app/src/main/AndroidManifest.xml
      - name: Clé de signature fixe (mises à jour sans désinstaller)
        env:
          PARTITEUR_KEYSTORE: ${{ secrets.PARTITEUR_KEYSTORE }}
        run: |
          if [ -n "$PARTITEUR_KEYSTORE" ]; then echo "$PARTITEUR_KEYSTORE" | base64 -d > android/app/gd.keystore; else cp keys/partiteur.keystore android/app/gd.keystore; fi
          printf '\nandroid {\n  signingConfigs { gd { storeFile file("gd.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } }\n  buildTypes { debug { signingConfig signingConfigs.gd } }\n}\n' >> android/app/build.gradle
      - name: Numéro de version croissant
        run: |
          VER=$(node -p "require('./package.json').version")
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
          grep -n "version" android/app/build.gradle
      - name: Compiler
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk partiteur.apk
      - uses: actions/upload-artifact@v4
        with:
          name: partiteur.apk
          path: partiteur.apk
      - name: Publier en Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Partiteur build ${{ github.run_number }}
          files: |
            partiteur.apk
            bibliotheque/*.fab
